<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Les Matières au CI - NEBULA</title>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #000000;
      --secondary-color: #7F6B00;
      --accent-color: #B8941F;
      --gold-light: #D4AF37;
      --gold-dark: #5D4A00;
      --text-color: #ffffff;
      --text-light: #cccccc;
      --bg-dark: #0a0a0a;
      --card-bg: rgba(15, 15, 15, 0.9);
      --border: rgba(127, 107, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
      color: var(--text-color);
      min-height: 100vh;
      line-height: 1.6;
      position: relative;
      overflow-x: hidden;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* Effets de particules dorées */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    .particle {
      position: absolute;
      background: var(--gold-light);
      border-radius: 50%;
      opacity: 0;
      animation: floatParticle 8s infinite linear;
    }

    @keyframes floatParticle {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.3;
      }
      90% {
        opacity: 0.3;
      }
      100% {
        transform: translateY(-100px) rotate(360deg);
        opacity: 0;
      }
    }

    .container {
      max-width: 1000px;
      width: 100%;
      background: var(--card-bg);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 1;
    }

    /* Header élégant */
    .page-header {
      text-align: center;
      padding: 0 0 40px 0;
      position: relative;
    }

    .header-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center top, rgba(127, 107, 0, 0.2) 0%, transparent 70%);
      z-index: -1;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--accent-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 15px;
      text-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .page-subtitle {
      font-size: 1.1rem;
      color: var(--text-light);
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #hiddenButtons {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 25px;
      width: 100%;
    }

    .subject-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 30px 20px;
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      animation: fadeInUp 0.6s ease forwards;
      opacity: 0;
      text-decoration: none;
      color: inherit;
    }

    .subject-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.1), transparent);
      transition: left 0.6s ease;
    }

    .subject-card:hover::before {
      left: 100%;
    }

    .subject-card:hover {
      transform: translateY(-10px) scale(1.02);
      border-color: var(--gold-light);
      box-shadow: 
        0 15px 40px rgba(127, 107, 0, 0.4),
        0 0 0 1px rgba(212, 175, 55, 0.1);
      text-decoration: none;
      color: inherit;
    }

    .subject-card img {
      width: 50px;
      height: 50px;
      margin-bottom: 20px;
      object-fit: contain;
      transition: all 0.3s ease;
      filter: brightness(0) saturate(100%) invert(72%) sepia(60%) saturate(500%) hue-rotate(10deg) brightness(90%) contrast(90%);
    }

    .subject-card:hover img {
      transform: scale(1.1);
      filter: brightness(0) saturate(100%) invert(84%) sepia(30%) saturate(600%) hue-rotate(10deg) brightness(105%) contrast(90%);
    }

    .subject-name {
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--gold-light);
      transition: all 0.3s ease;
    }

    .subject-card:hover .subject-name {
      color: var(--text-color);
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
    }

    /* Effet de brillance sur les cartes */
    .subject-card::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(212, 175, 55, 0.1), transparent);
      transform: rotate(45deg);
      transition: all 0.6s ease;
      opacity: 0;
    }

    .subject-card:hover::after {
      opacity: 1;
      transform: rotate(45deg) translate(50%, 50%);
    }

    /* Animation d'entrée */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Délais d'animation pour chaque carte */
    .subject-card:nth-child(1) { animation-delay: 0.1s; }
    .subject-card:nth-child(2) { animation-delay: 0.2s; }
    .subject-card:nth-child(3) { animation-delay: 0.3s; }
    .subject-card:nth-child(4) { animation-delay: 0.4s; }
    .subject-card:nth-child(5) { animation-delay: 0.5s; }
    .subject-card:nth-child(6) { animation-delay: 0.6s; }
    .subject-card:nth-child(7) { animation-delay: 0.7s; }
    .subject-card:nth-child(8) { animation-delay: 0.8s; }

    /* Bouton retour */
    .back-button {
      position: fixed;
      top: 30px;
      left: 30px;
      background: rgba(15, 15, 15, 0.8);
      color: var(--gold-light);
      border: 1px solid rgba(127, 107, 0, 0.5);
      padding: 12px 25px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(10px);
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .back-button:hover {
      background: rgba(127, 107, 0, 0.2);
      transform: translateX(-5px);
      border-color: var(--gold-light);
      color: var(--gold-light);
      text-decoration: none;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container {
        padding: 30px 20px;
        margin: 20px;
      }
      
      h1 {
        font-size: 2.2rem;
        flex-direction: column;
        gap: 10px;
      }
      
      #hiddenButtons {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 20px;
      }
      
      .subject-card {
        padding: 25px 15px;
      }
      
      .subject-card img {
        width: 40px;
        height: 40px;
        margin-bottom: 15px;
      }
      
      .subject-name {
        font-size: 1rem;
      }
      
      .back-button {
        top: 20px;
        left: 20px;
        padding: 10px 20px;
        font-size: 12px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }
      
      .container {
        padding: 25px 15px;
      }
      
      h1 {
        font-size: 1.8rem;
      }
      
      .page-subtitle {
        font-size: 0.9rem;
      }
      
      #hiddenButtons {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 15px;
      }
      
      .subject-card {
        padding: 20px 10px;
      }
      
      .subject-card img {
        width: 35px;
        height: 35px;
      }
      
      .subject-name {
        font-size: 0.9rem;
      }
      
      .back-button {
        top: 15px;
        left: 15px;
        padding: 8px 15px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <!-- Effets de particules -->
  <div class="particles" id="particles"></div>

  <!-- Bouton retour à l'accueil -->
  <a href="./index.html" class="back-button">
    <i class="fas fa-arrow-left"></i>
    Retour à l'accueil
  </a>

  <div class="container">
    <!-- Header de la page -->
    <header class="page-header">
      <div class="header-bg"></div>
      <h1><i class="fas fa-book-open"></i> Les Matières au CI</h1>
      <p class="page-subtitle">Découvrez les matières de Cours d'Initiation</p>

    <div id="section2">

  <script>
    // Création des particules animées
    document.addEventListener('DOMContentLoaded', function() {
      const particlesContainer = document.getElementById('particles');
      const particleCount = 20;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        
        const size = Math.random() * 4 + 1;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${Math.random() * 100}%`;
        particle.style.animationDelay = `${Math.random() * 8}s`;
        particle.style.animationDuration = `${Math.random() * 10 + 8}s`;
        
        particlesContainer.appendChild(particle);
      }

      // Animation des cartes
      const subjectCards = document.querySelectorAll('.subject-card');
      subjectCards.forEach((card, index) => {
        card.style.animationDelay = `${(index % 8) * 0.1}s`;
      });
    });
  </script>
</body>
</html>
