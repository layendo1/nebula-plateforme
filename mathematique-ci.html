<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programme de Mathématiques CI - NEBULA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #000000;
            --secondary-color: #7F6B00;
            --accent-color: #B8941F;
            --gold-light: #D4AF37;
            --gold-dark: #5D4A00;
            --text-color: #ffffff;
            --text-light: #cccccc;
            --bg-dark: #0a0a0a;
            --card-bg: rgba(15, 15, 15, 0.9);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            color: var(--text-color);
            position: relative;
            overflow-x: hidden;
        }

        /* Effets de particules dorées */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            background: var(--gold-light);
            border-radius: 50%;
            opacity: 0;
            animation: floatParticle 8s infinite linear;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Header élégant */
        .page-header {
            text-align: center;
            padding: 60px 20px 40px;
            position: relative;
        }

        .header-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center top, rgba(127, 107, 0, 0.2) 0%, transparent 70%);
            z-index: -1;
        }

        .page-title {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--accent-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
        }

        .page-subtitle {
            font-size: 1.1rem;
            color: var(--text-light);
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* Container principal */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        /* Liste des leçons */
        .lessons-container {
            background: var(--card-bg);
            border: 1px solid rgba(127, 107, 0, 0.3);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .lessons-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.05), transparent);
            transition: left 0.6s ease;
        }

        .lessons-container:hover::before {
            left: 100%;
        }

        .lesson-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .lesson-item {
            margin-bottom: 15px;
            position: relative;
            transition: all 0.3s ease;
        }

        .lesson-link {
            display: flex;
            align-items: center;
            color: var(--text-color);
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            padding: 18px 20px;
            background: rgba(30, 30, 30, 0.7);
            border-radius: 12px;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 1px solid rgba(127, 107, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .lesson-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .lesson-link:hover::before {
            left: 100%;
        }

        .lesson-number {
            background: linear-gradient(135deg, var(--secondary-color) 0%, var(--accent-color) 100%);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            margin-right: 15px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .lesson-link:hover .lesson-number {
            transform: scale(1.1) rotate(5deg);
        }

        .lesson-title {
            flex: 1;
            line-height: 1.4;
        }

        .lesson-link:hover {
            background: rgba(40, 40, 40, 0.9);
            transform: translateX(10px);
            border-color: var(--gold-light);
            box-shadow: 
                0 5px 20px rgba(127, 107, 0, 0.3),
                0 0 0 1px rgba(212, 175, 55, 0.1);
        }

        .classroom-icon {
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s ease;
            color: var(--gold-light);
            margin-left: 10px;
        }

        .lesson-link:hover .classroom-icon {
            opacity: 1;
            transform: translateX(0);
        }

        /* Bouton retour */
        .back-button {
            position: fixed;
            top: 30px;
            left: 30px;
            background: rgba(15, 15, 15, 0.8);
            color: var(--gold-light);
            border: 1px solid rgba(127, 107, 0, 0.5);
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .back-button:hover {
            background: rgba(127, 107, 0, 0.2);
            transform: translateX(-5px);
            border-color: var(--gold-light);
        }

        /* Animation d'entrée */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .lesson-item {
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
        }

        .lesson-item:nth-child(1) { animation-delay: 0.1s; }
        .lesson-item:nth-child(2) { animation-delay: 0.15s; }
        .lesson-item:nth-child(3) { animation-delay: 0.2s; }
        .lesson-item:nth-child(4) { animation-delay: 0.25s; }

        /* Badge CI */
        .ci-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, var(--secondary-color) 0%, var(--accent-color) 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(127, 107, 0, 0.3);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .page-title {
                font-size: 2.2rem;
            }
            
            .lessons-container {
                padding: 25px 20px;
            }
            
            .lesson-link {
                padding: 15px;
                font-size: 15px;
            }
            
            .lesson-number {
                width: 32px;
                height: 32px;
                font-size: 13px;
                margin-right: 12px;
            }
            
            .back-button {
                top: 20px;
                left: 20px;
                padding: 10px 20px;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .page-header {
                padding: 50px 15px 30px;
            }
            
            .page-title {
                font-size: 1.8rem;
            }
            
            .container {
                padding: 0 15px 40px;
            }
            
            .lesson-link {
                padding: 12px;
                font-size: 14px;
            }
            
            .lesson-number {
                width: 28px;
                height: 28px;
                font-size: 12px;
                margin-right: 10px;
            }
            
            .classroom-icon {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Effets de particules -->
    <div class="particles" id="particles"></div>

    <!-- Bouton retour -->
    <a href="matieres-ci.html" class="back-button">
        <i class="fas fa-arrow-left"></i>
        Retour aux matières
    </a>

    <!-- Header de la page -->
    <header class="page-header">
        <div class="header-bg"></div>
        <h1 class="page-title">Programme de Mathématiques</h1>
        <p class="page-subtitle">Cours d'Initiation - 4 domaines d'activités</p>
    </header>

    <!-- Contenu principal -->
    <div class="container">
        <div class="lessons-container">
            <div class="ci-badge">CI</div>
            
            <ul class="lesson-list">
                <li class="lesson-item">
                    <a href="https://classroom.google.com/c/Nzc3Mzg1MDkxOTM0?cjc=5lxr2bfw" target="_blank" class="lesson-link">
                        <span class="lesson-number">1</span>
                        <span class="lesson-title">Activités Numériques</span>
                        <i class="fas fa-external-link-alt classroom-icon"></i>
                    </a>
                </li>
                <li class="lesson-item">
                    <a href="https://classroom.google.com/c/NzYwOTAwNTI0NzUy?cjc=otn4nev3" target="_blank" class="lesson-link">
                        <span class="lesson-number">2</span>
                        <span class="lesson-title">Activités Géométriques</span>
                        <i class="fas fa-external-link-alt classroom-icon"></i>
                    </a>
                </li>
                <li class="lesson-item">
                    <a href="https://classroom.google.com/c/Nzc3Mzg3MjY3MjI0?cjc=besm6iub" target="_blank" class="lesson-link">
                        <span class="lesson-number">3</span>
                        <span class="lesson-title">Activités de Mesure</span>
                        <i class="fas fa-external-link-alt classroom-icon"></i>
                    </a>
                </li>
                <li class="lesson-item">
                    <a href="https://classroom.google.com/c/Nzc3Mzg4NzU2NTIx?cjc=3lcxjzkk" target="_blank" class="lesson-link">
                        <span class="lesson-number">4</span>
                        <span class="lesson-title">Activités de Résolution de Problèmes</span>
                        <i class="fas fa-external-link-alt classroom-icon"></i>
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <script>
        // Création des particules animées
        document.addEventListener('DOMContentLoaded', function() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 15;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Taille aléatoire
                const size = Math.random() * 3 + 1;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                // Position de départ aléatoire
                particle.style.left = `${Math.random() * 100}%`;
                
                // Animation
                particle.style.animationDelay = `${Math.random() * 8}s`;
                particle.style.animationDuration = `${Math.random() * 10 + 8}s`;
                
                particlesContainer.appendChild(particle);
            }
        });
    </script>
</body>
</html>
