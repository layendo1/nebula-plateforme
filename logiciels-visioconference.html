<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logiciels de Visioconférence - NEBULA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #000000;
            --secondary-color: #7F6B00;
            --accent-color: #B8941F;
            --gold-light: #D4AF37;
            --gold-dark: #5D4A00;
            --text-color: #ffffff;
            --text-light: #cccccc;
            --bg-dark: #0a0a0a;
            --card-bg: rgba(15, 15, 15, 0.9);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            color: var(--text-color);
            position: relative;
            overflow-x: hidden;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* Effets de particules dorées */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            background: var(--gold-light);
            border-radius: 50%;
            opacity: 0;
            animation: floatParticle 8s infinite linear;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(127, 107, 0, 0.3);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1;
        }

        /* Header élégant */
        .page-header {
            text-align: center;
            padding: 0 0 40px 0;
            position: relative;
        }

        .header-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center top, rgba(127, 107, 0, 0.2) 0%, transparent 70%);
            z-index: -1;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--accent-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .page-subtitle {
            font-size: 1.1rem;
            color: var(--text-light);
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #hiddenButtons {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
            width: 100%;
        }

        .software-card {
            background: var(--card-bg);
            border: 1px solid rgba(127, 107, 0, 0.3);
            border-radius: 15px;
            padding: 30px 20px;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
            text-decoration: none;
            color: inherit;
        }

        .software-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.1), transparent);
            transition: left 0.6s ease;
        }

        .software-card:hover::before {
            left: 100%;
        }

        .software-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--gold-light);
            box-shadow: 
                0 15px 40px rgba(127, 107, 0, 0.4),
                0 0 0 1px rgba(212, 175, 55, 0.1);
            text-decoration: none;
            color: inherit;
        }

        .software-card img {
            width: 50px;
            height: 50px;
            margin-bottom: 20px;
            object-fit: contain;
            transition: all 0.3s ease;
            filter: brightness(0) saturate(100%) invert(72%) sepia(60%) saturate(500%) hue-rotate(10deg) brightness(90%) contrast(90%);
        }

        .software-card:hover img {
            transform: scale(1.1);
            filter: brightness(0) saturate(100%) invert(84%) sepia(30%) saturate(600%) hue-rotate(10deg) brightness(105%) contrast(90%);
        }

        .software-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--gold-light);
            transition: all 0.3s ease;
        }

        .software-card:hover .software-name {
            color: var(--text-color);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        /* Effet de brillance sur les cartes */
        .software-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(212, 175, 55, 0.1), transparent);
            transform: rotate(45deg);
            transition: all 0.6s ease;
            opacity: 0;
        }

        .software-card:hover::after {
            opacity: 1;
            transform: rotate(45deg) translate(50%, 50%);
        }

        /* Animation d'entrée */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Délais d'animation pour chaque carte */
        .software-card:nth-child(1) { animation-delay: 0.1s; }
        .software-card:nth-child(2) { animation-delay: 0.2s; }
        .software-card:nth-child(3) { animation-delay: 0.3s; }
        .software-card:nth-child(4) { animation-delay: 0.4s; }
        .software-card:nth-child(5) { animation-delay: 0.5s; }
        .software-card:nth-child(6) { animation-delay: 0.6s; }

        /* Bouton retour */
        .back-button {
            position: fixed;
            top: 30px;
            left: 30px;
            background: rgba(15, 15, 15, 0.8);
            color: var(--gold-light);
            border: 1px solid rgba(127, 107, 0, 0.5);
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .back-button:hover {
            background: rgba(127, 107, 0, 0.2);
            transform: translateX(-5px);
            border-color: var(--gold-light);
            color: var(--gold-light);
            text-decoration: none;
        }

        /* Badge NEBULA */
        .nebula-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, var(--secondary-color) 0%, var(--accent-color) 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(127, 107, 0, 0.3);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
                margin: 20px;
            }
            
            h1 {
                font-size: 2.2rem;
                flex-direction: column;
                gap: 10px;
            }
            
            #hiddenButtons {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 20px;
            }
            
            .software-card {
                padding: 25px 15px;
            }
            
            .software-card img {
                width: 40px;
                height: 40px;
                margin-bottom: 15px;
            }
            
            .software-name {
                font-size: 1rem;
            }
            
            .back-button {
                top: 20px;
                left: 20px;
                padding: 10px 20px;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .container {
                padding: 25px 15px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .page-subtitle {
                font-size: 0.9rem;
            }
            
            #hiddenButtons {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 15px;
            }
            
            .software-card {
                padding: 20px 10px;
            }
            
            .software-card img {
                width: 35px;
                height: 35px;
            }
            
            .software-name {
                font-size: 0.9rem;
            }
            
            .back-button {
                top: 15px;
                left: 15px;
                padding: 8px 15px;
                font-size: 11px;
            }
        }
    </style>
  </head>
  <body>
    <!-- Effets de particules -->
    <div class="particles" id="particles"></div>

    <!-- Bouton retour à l'accueil -->
    <a href="./index.html" class="back-button">
        <i class="fas fa-arrow-left"></i>
        Retour à l'accueil
    </a>

    <div class="container">
        <!-- Header de la page -->
        <header class="page-header">
            <div class="header-bg"></div>
            <h1><i class="fas fa-video"></i> Logiciels de Visioconférence</h1>
            <p class="page-subtitle">Outils de communication - 6 applications</p>
            <div class="nebula-badge">NEBULA</div>
        </header>

        <div id="section2">
            <div id="hiddenButtons">
                <a href="https://discord.com" class="software-card" target="_blank">
                    <img src="https://cdn-icons-png.flaticon.com/128/3192/3192965.png" alt="Discord">
                    <div class="software-name">Discord</div>
                </a>
                
                <a href="https://www.microsoft.com/fr-fr/microsoft-teams/free" class="software-card" target="_blank">
                    <img src="https://cdn-icons-png.flaticon.com/128/7185/7185638.png" alt="Microsoft Teams">
                    <div class="software-name">Microsoft Teams</div>
                </a>
                
                <a href="https://meet.google.com" class="software-card" target="_blank">
                    <img src="https://cdn-icons-png.flaticon.com/128/3048/3048504.png" alt="Google Meet">
                    <div class="software-name">Google Meet</div>
                </a>
                
                <a href="https://www.zoom.com/fr" class="software-card" target="_blank">
                    <img src="https://cdn-icons-png.flaticon.com/128/2989/2989389.png" alt="Zoom">
                    <div class="software-name">Zoom</div>
                </a>
                
                <a href="https://kmeet.infomaniak.com/" class="software-card" target="_blank">
                    <img src="https://cdn-icons-png.flaticon.com/128/1376/1376516.png" alt="Infomaniak">
                    <div class="software-name">Infomaniak</div>
                </a>
                
                <a href="https://meet.jit.si" class="software-card" target="_blank">
                    <img src="https://cdn-icons-png.flaticon.com/128/609/609010.png" alt="Jitsi Meet">
                    <div class="software-name">Jitsi Meet</div>
                </a>
            </div>
        </div>
    </div>

    <script>
        // Création des particules animées
        document.addEventListener('DOMContentLoaded', function() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 20;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 4 + 1;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.animationDelay = `${Math.random() * 8}s`;
                particle.style.animationDuration = `${Math.random() * 10 + 8}s`;
                
                particlesContainer.appendChild(particle);
            }

            // Animation des cartes
            const softwareCards = document.querySelectorAll('.software-card');
            softwareCards.forEach((card, index) => {
                card.style.animationDelay = `${(index % 6) * 0.1}s`;
            });
        });
    </script>
  </body>
</html>
